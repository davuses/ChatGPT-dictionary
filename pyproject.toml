[project]
name = "chatgpt-dictionary"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "fastapi>=0.115.5",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.4",
    "markdown2>=2.5.1",
    "phonemizer>=3.3.0",
    "pwdlib[argon2]>=0.3.1",
    "python-multipart>=0.0.17",
    "requests>=2.32.3",
    "sqlalchemy==2.0.19",
    "uvicorn[standard]>=0.32.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=6.29.5",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
