<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glossbook</title>
  <script src="theme-init.js"></script>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="sp-header">
    <div class="sp-brand-row">
      <h1 class="sp-brand">
        <a id="brand-link" class="sp-brand-link" href="#" target="_blank" rel="noopener noreferrer">
          <span class="sp-brand-mark" aria-hidden="true"></span>
          <span>Glossbook</span>
        </a>
      </h1>
      <div class="sp-header-actions">
        <a id="open-inbox-link" class="sp-btn sp-btn-ghost" href="#" target="_blank" rel="noopener noreferrer" hidden data-i18n="inbox">Inbox</a>
        <button id="toggle-settings-btn" class="sp-btn sp-btn-ghost" type="button" aria-expanded="false" aria-controls="settings-panel" data-i18n="settings">Settings</button>
      </div>
    </div>
    <div id="page-banner" class="sp-page-banner">
      <div id="page-title" class="sp-page-title" data-i18n="loading_tab">Loading tab&hellip;</div>
      <div id="page-url" class="sp-page-url"></div>
    </div>
  </header>

  <div id="update-banner" class="sp-update-banner" hidden>
    <span id="update-banner-text"></span>
    <a id="update-banner-link" class="sp-link-btn" href="#" target="_blank" rel="noopener noreferrer" data-i18n="update_how">How to update &rarr;</a>
  </div>

  <section id="settings-panel" class="sp-card sp-settings" hidden>
    <div class="sp-section-head">
      <h2><span data-i18n="settings_title">Connection settings</span> <span id="ext-version-badge" class="sp-count"></span></h2>
      <button id="close-settings-btn" class="sp-link-btn" type="button" data-i18n="close">Close</button>
    </div>
    <label class="sp-label" for="server-url-input" data-i18n="settings_server_url">Server URL</label>
    <input id="server-url-input" class="sp-input" type="url" placeholder="http://localhost:8000">
    <div class="sp-label-row">
      <label class="sp-label" for="api-token-input"><span data-i18n="settings_api_token">API Token</span> <span class="sp-hint" data-i18n="settings_token_hint">(stored locally only)</span></label>
      <a id="get-token-link" class="sp-link-btn" href="#" target="_blank" rel="noopener noreferrer" hidden data-i18n="get_token">Get token &nearr;</a>
    </div>
    <div class="sp-input-group">
      <input id="api-token-input" class="sp-input" type="password" placeholder="Paste your API token from /account" data-i18n-placeholder="settings_token_placeholder">
      <button id="toggle-token-vis-btn" class="sp-btn sp-btn-ghost" type="button" data-i18n="show">Show</button>
    </div>
    <div class="sp-settings-field">
      <span class="sp-label" id="theme-group-label" data-i18n="settings_theme_label">Theme</span>
      <div id="theme-segmented" class="sp-segmented" role="radiogroup" aria-labelledby="theme-group-label">
        <button type="button" class="sp-seg-btn" role="radio" aria-checked="true" data-theme-value="auto" data-i18n="theme_auto_short">Auto</button>
        <button type="button" class="sp-seg-btn" role="radio" aria-checked="false" data-theme-value="light" data-i18n="theme_light">Light</button>
        <button type="button" class="sp-seg-btn" role="radio" aria-checked="false" data-theme-value="dark" data-i18n="theme_dark">Dark</button>
      </div>
    </div>
    <label class="sp-label" for="lang-select" data-i18n="settings_lang_label">Language</label>
    <select id="lang-select" class="sp-input">
      <option value="auto" data-i18n="lang_auto">Auto (Browser)</option>
      <option value="en">English</option>
      <option value="zh-CN">简体中文</option>
    </select>
    <div class="sp-row">
      <button id="save-settings-btn" class="sp-btn sp-btn-primary" type="button" data-i18n="save_test">Save &amp; test</button>
      <span id="settings-status" class="sp-status"></span>
    </div>
  </section>

  <div id="global-notice" class="sp-notice" hidden></div>

  <main id="workspace" class="sp-workspace" hidden>
    <section class="sp-composer">
      <form id="jot-form">
        <div class="sp-composer-word-row">
          <input id="jot-word" class="sp-input sp-word-input" type="text" placeholder="Word or phrase (e.g. finances)" data-i18n-placeholder="jot_word_placeholder" autocomplete="off" required>
          <button id="grab-page-btn" class="sp-btn sp-btn-ghost sp-grab-btn" type="button" data-i18n="grab_from_page">Grab</button>
        </div>
        <textarea id="jot-context" class="sp-textarea sp-context-input" rows="1" placeholder="Context sentence (optional — Ctrl+Enter to save)" data-i18n-placeholder="jot_context_placeholder"></textarea>
        <div id="jot-ts-row" class="sp-ts-row" hidden>
          <span id="jot-ts-label" class="sp-pill"></span>
          <button id="clear-ts-btn" class="sp-link-btn" type="button" data-i18n="clear_ts">Clear timestamp</button>
        </div>
        <div class="sp-row sp-composer-actions">
          <button id="jot-submit-btn" class="sp-btn sp-btn-primary" type="submit" data-i18n="jot_word">Jot word</button>
          <button id="jot-lookup-btn" class="sp-btn sp-btn-ghost" type="button" data-i18n="lookup">Lookup</button>
          <span id="jot-status" class="sp-status"></span>
        </div>
        <div id="jot-lookup-box" class="sp-lookup-box sp-jot-lookup" hidden></div>
      </form>
    </section>

    <div class="sp-tabs" role="tablist" aria-label="Workspace views">
      <button type="button" class="sp-tab-btn" id="tab-btn-words" role="tab" aria-selected="true" aria-controls="tab-panel-words" data-sp-tab="words">
        <span data-i18n="tab_words">Words</span>
        <span id="items-count" class="sp-count"></span>
      </button>
      <button type="button" class="sp-tab-btn" id="tab-btn-notes" role="tab" aria-selected="false" aria-controls="tab-panel-notes" data-sp-tab="notes">
        <span data-i18n="tab_notes">Notes</span>
        <span id="notes-tab-dot" class="sp-tab-dot" hidden aria-hidden="true"></span>
      </button>
    </div>

    <section id="tab-panel-words" class="sp-tab-panel" role="tabpanel" aria-labelledby="tab-btn-words">
      <div id="items-toolbar" class="sp-items-toolbar" hidden>
        <button id="toggle-select-all-btn" class="sp-link-btn" type="button" data-i18n="select_all">Select all</button>
        <button id="promote-selected-btn" class="sp-btn sp-btn-primary" type="button" hidden data-i18n="add_selected">Add selected</button>
      </div>
      <p id="items-empty" class="sp-empty" data-i18n="items_empty">No words jotted for this page yet.</p>
      <ul id="items-list" class="sp-items"></ul>
      <div id="promote-status" class="sp-status"></div>
    </section>

    <section id="tab-panel-notes" class="sp-tab-panel sp-tab-panel--notes" role="tabpanel" aria-labelledby="tab-btn-notes" hidden>
      <div class="sp-notes-head">
        <span class="sp-notes-label" data-i18n="scratchpad">Page scratchpad</span>
        <span id="notes-status" class="sp-status" data-i18n="auto_saved">Auto-saved</span>
      </div>
      <textarea id="notes-textarea" class="sp-textarea sp-notes-textarea" placeholder="Freeform Markdown notes for this video or article&hellip;" data-i18n-placeholder="scratchpad_placeholder"></textarea>
    </section>
  </main>

  <script src="sidepanel.js"></script>
</body>
</html>
